<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <meta name="description" content="order summary">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>

<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css"  >
</head>
<body>


  <main class="mainwrapper" >


    <section class="card" >
    
       <div class="card-img"> <!--fetchpriority=high like loading lazy-->
        <img src="images/illustration-hero.svg" alt="card of order" fetchpriority=high>
      </div>
      <div class="card-content">
        <div class="card-body">
        <h1> Order Summary</h1>

        <p>You can now listen to millions of songs, audiobooks, and podcasts on any 
        device anywhere you like!</p>

        <div class="card-plan">

          <div class="card-salary">

            <div class="icon">
              <img src="images/icon-music.svg" width="40" height="auto" alt="order of salary" >
            </div>

            <div class="card-typeplan">
              <p>Annual Plan</p>
              <p>$59.99/year</p>
            </div>
          </div>

          <div class="card-change">
            <a href="#">Change</a>
          </div>

        </div>

        
      <button class="card-payment">Proceed to Payment</button>
       

   
      <button class="card-cancelorder">Cancel Order</button>
        
      </div>
        
      </section>
      
    </main>

    


  
  
  <footer class="attribution" >
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Sara Ghazy</a>.
  </footer>
    
  </div>

 

</body>
</html>
